name: Tests

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]

# One run per PR (or per ref for pushes). A new push to a PR cancels that PR's
# in-flight run; pushes to mainline always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No npm install: the project has zero runtime or test-time deps.
      # The tests write a strict fake codex into a temp dir and put it on
      # PATH, so CI needs neither the real codex CLI nor a ChatGPT login.
      # The real-codex contract tests skip when codex isn't installed.
      - run: node --version
      - run: npm run check
      - run: npm test
